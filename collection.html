---
title: Collection · Terry Wang
layout: default
bodyClass: collection-page
---

{% include header.html %}

<main>
  <section class="page-banner">
    <h1 class="page-title">Collection</h1>
    <p class="page-lead">和 AI 一起探索艺术，收藏途中喜欢的作品。</p>
  </section>

  {% for artwork in site.data.artworks %}
  <figure class="collection-artwork">
    <a class="collection-image" href="{{ artwork.image | relative_url }}" aria-label="查看《{{ artwork.title | escape }}》原图">
      <img src="{{ artwork.image | relative_url }}" alt="{{ artwork.alt | escape }}" width="{{ artwork.width }}" height="{{ artwork.height }}" decoding="async"{% unless forloop.first %} loading="lazy"{% endunless %}>
    </a>
    <figcaption>
      <h2>{{ artwork.title | escape }}</h2>
      <time datetime="{{ artwork.date }}">{{ artwork.date }}</time>
      <p>{{ artwork.description | escape }}</p>
      <p class="weak">{{ artwork.medium | escape }} · AI 生成</p>
    </figcaption>
  </figure>
  {% endfor %}
</main>

<style>
  .collection-artwork { margin: 0 0 4rem; }
  .collection-image { display: block; }
  .collection-image img { display: block; width: 100%; height: auto; }
  .collection-artwork figcaption { padding-top: 1.25rem; }
  .collection-artwork h2 { margin: 0 0 .25rem; font-size: 1.25rem; font-weight: 500; }
  .collection-artwork time { color: var(--muted-color); font: .875rem ui-monospace, monospace; }
  .collection-artwork p { margin: .75rem 0 0; }
  .collection-artwork .weak { font-size: .875rem; }
</style>
