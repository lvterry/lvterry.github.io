---
title: Collection · Terry Wang
layout: default
bodyClass: collection-page
---

{% include header.html %}

<main>
  <section class="page-banner">
    <h1 class="page-title">Collection</h1>
    <p class="page-lead">和 AI 一起探索艺术，收藏途中喜欢的作品。</p>
  </section>

  {% for artwork in site.data.artworks %}
  <figure class="collection-artwork">
    <a class="collection-image" href="{{ artwork.image | relative_url }}" aria-label="查看《{{ artwork.title | escape }}》原图">
      <img src="{{ artwork.image | relative_url }}" alt="{{ artwork.alt | escape }}" width="{{ artwork.width }}" height="{{ artwork.height }}" decoding="async"{% unless forloop.first %} loading="lazy"{% endunless %}>
    </a>
    <figcaption>
      <h2>{{ artwork.title | escape }}</h2>
      <time datetime="{{ artwork.date }}">{{ artwork.date }}</time>
      <p>{{ artwork.description | escape }}</p>
      <p class="weak">{{ artwork.medium | escape }} · AI 生成</p>
    </figcaption>
  </figure>
  {% endfor %}
</main>

<dialog class="collection-lightbox" aria-label="查看原图">
  <button type="button" class="collection-lightbox-close" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <img alt="">
</dialog>

<style>
  .collection-artwork { margin: 0 0 4rem; }
  .collection-image {
    display: block;
    width: fit-content;
    cursor: zoom-in;
    touch-action: manipulation;
    text-decoration: none;
  }
  .collection-image img {
    display: block;
    width: 220px;
    max-width: 100%;
    height: auto;
  }
  .collection-artwork figcaption { padding-top: 1.25rem; }
  .collection-artwork h2 { margin: 0 0 .25rem; font-size: 1.25rem; font-weight: 500; }
  .collection-artwork time { color: var(--muted-color); font: .875rem ui-monospace, monospace; }
  .collection-artwork p { margin: .75rem 0 0; }
  .collection-artwork .weak { font-size: .875rem; }

  @media (hover: hover) and (pointer: fine) {
    .collection-image:hover img { opacity: .88; }
  }

  .collection-lightbox {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: none;
    background: #0a0a0a;
  }
  .collection-lightbox[open] {
    display: grid;
    place-items: center;
  }
  .collection-lightbox::backdrop {
    background: #0a0a0a;
  }
  .collection-lightbox img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    object-fit: contain;
    cursor: zoom-out;
  }
  .collection-lightbox-close {
    position: fixed;
    top: max(.75rem, env(safe-area-inset-top));
    right: max(.75rem, env(safe-area-inset-right));
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    color: #f5f5f5;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (hover: hover) and (pointer: fine) {
    .collection-lightbox-close:hover { background: rgba(255, 255, 255, .22); }
  }
  .collection-lightbox[open] {
    animation: collection-lb-in 160ms ease-out;
  }
  @keyframes collection-lb-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .collection-lightbox[open] { animation: none; }
    .collection-image img { transition: none; }
  }
</style>

<script>
  (function () {
    const dialog = document.querySelector(".collection-lightbox");
    const fullImg = dialog.querySelector("img");
    const closeBtn = dialog.querySelector(".collection-lightbox-close");

    function openLightbox(link) {
      const thumb = link.querySelector("img");
      fullImg.src = link.href;
      fullImg.alt = thumb ? thumb.alt : "";
      dialog.showModal();
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      if (dialog.open) dialog.close();
    }

    dialog.addEventListener("close", function () {
      document.body.style.overflow = "";
      fullImg.removeAttribute("src");
    });

    closeBtn.addEventListener("click", closeLightbox);

    dialog.addEventListener("click", function (e) {
      if (e.target === dialog || e.target === fullImg) closeLightbox();
    });

    document.querySelectorAll(".collection-image").forEach(function (link) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        openLightbox(link);
      });
    });
  })();
</script>
