# status 只用：正面 / 观察 / 恶化 / 待核实。
# confidence 建议用：高 / 中 / 低。没有把握就留空。
# evidence 分四栏，不要混写：
#   facts      已核对的事实
#   guidance   管理层自己的说法
#   media      媒体或第二手转述
#   judgment   我们的判断
# 每一条可以是一句话，或者：
#   - text: 事实摘要
#     source_url: "https://..."
#     as_of: "YYYY-MM-DD"
#     recorded_at: "YYYY-MM-DD"
#     verified: false
# 日期加引号。verified 没核对就是 false，不要空着当已核实。
# focus 是要盯的问题清单，不是已经发生的事实。

