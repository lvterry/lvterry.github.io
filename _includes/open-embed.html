<style>
.videoWrapper {
	position: relative;
	padding-bottom: 56.333%;
	height: 0;
    background: black;
}
.videoWrapper iframe {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
    border: 0;
}    
</style>

<script>
function get_youtube_id(url) {
    var p = /^(?:https?:\/\/)?(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})(?:\S+)?$/;
    return (url.match(p)) ? RegExp.$1 : false;
}
function vimeo_embed(url,el) {
    fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent(url))
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(response) {
        if(!response || !response.video_id) return;
        var id = response.video_id;
        var autoplay = url.indexOf('autoplay=1') !== -1 ? 1 : 0;
        var loop = url.indexOf('loop=1') !== -1 ? 1 : 0;
        var theInnerHTML = '<div class="videoWrapper"><iframe src="https://player.vimeo.com/video/'+id+'/?byline=0&title=0&portrait=0';
        if(autoplay==1) theInnerHTML += '&autoplay=1';
        if(loop==1) theInnerHTML += '&loop=1';
        theInnerHTML += '" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe></div>';
        el.innerHTML = theInnerHTML;
      })
      .catch(function() { /* leave the original link in place */ });
}
/* Returns the href when the paragraph is nothing but a single link, else ''.
   Markdown (and GFM autolinking) wrap bare URLs in <a>, so paragraphs never
   start with "http". */
function paragraph_link_only(el) {
    var kids = el.children;
    if (kids.length !== 1 || kids[0].tagName !== 'A') return '';
    if (el.textContent.trim() !== kids[0].textContent.trim()) return '';
    return kids[0].getAttribute('href') || '';
}
/* Parse a URL through an anchor so query strings and fragments are handled. */
function parse_url(url) {
    var a = document.createElement('a');
    a.href = url;
    return a;
}
function video_embed() {
    var p = document.getElementsByTagName('p');
    for(var i = 0; i < p.length; i++) {
        var url = paragraph_link_only(p[i]);
        if(!url) continue;

        var youtube_id = get_youtube_id(url);
        if(youtube_id) {
            var autoplay = url.indexOf('autoplay=1') !== -1 ? 1 : 0;
            var loop = url.indexOf('loop=1') !== -1 ? 1 : 0;
            var theInnerHTML = '<div class="videoWrapper"><iframe width="720" height="420" src="https://www.youtube.com/embed/' + youtube_id + '?rel=0&showinfo=0';
            if(autoplay==1) theInnerHTML += '&autoplay=1';
            if(loop==1) theInnerHTML += '&loop=1&playlist='+youtube_id+'&version=3';
            if(url.indexOf('start=') !== -1) theInnerHTML += '&start='+parse_url(url).search.replace(/^\?(?:.*&)?start=(\d+).*$/, '$1');
            theInnerHTML += '" frameborder="0" allowfullscreen></iframe></div>';
            p[i].innerHTML = theInnerHTML;
        } else if(url.indexOf('vimeo.com') !== -1) {
            vimeo_embed(url, p[i]);
        }
    }
}
video_embed();

function mp3_embed() {
    var p = document.getElementsByTagName('p');
    for(var i = 0; i < p.length; i++) {
        var url = paragraph_link_only(p[i]);
        if(!url || url.indexOf('.mp3') === -1) continue;

        var u = parse_url(url);
        /* Only rewrite a URL whose path really ends in .mp3; otherwise the
           paragraph is prose that merely mentions one, so leave it alone. */
        if(u.pathname.lastIndexOf('.mp3') !== u.pathname.length - 4) continue;

        var autoplay = u.search.indexOf('autoplay=1') !== -1 ? 1 : 0;
        var loop = u.search.indexOf('loop=1') !== -1 ? 1 : 0;
        var controls = u.search.indexOf('controls=0') !== -1 ? 0 : 1;

        var newInnerHTML = '<audio';
        if(autoplay==1) newInnerHTML += ' autoplay';
        if(loop==1) newInnerHTML += ' loop';
        if(controls==1) newInnerHTML += ' controls';
        newInnerHTML += '><source src="'+u.href+'" type="audio/mpeg">Your browser does not support the audio element.</audio>';
        p[i].innerHTML = newInnerHTML;
    }
}
mp3_embed();
</script>
