# _data/classes.yml
# 课程页的存档，不是运行时数据源。打开 class.html 时浏览器读取 Google 表格。
# 新增上课或缴费只往表格的 Sessions / Payments 追加一行，不要改这个文件，
# 也不要为此发布网站。表格读不到时，页面才显示这里的内容，并写明存档日期。
# 维护方式见 docs/classes.md。
#
# snapshot_as_of 是这份存档冻结的日期。只有重新从表格导出存档时才改它。
# 页面用它标注「不是实时数据」，不会把它当成刚刚读到的课。
#
# 结构仍与原来相同，方便对照：
#   courses[]            每门课一条。key 只用于锚点和配色，label 是展示名。
#   courses[].payments[] 缴费。date / amount / credits 必填，note 可选。
#   courses[].sessions[] 上课。date 必填；credits 默认 1；mode 为 线上 / 线下。
# 剩余课时和本卡进度由页面计算。日期加引号，写成 "YYYY-MM-DD"。
# 颜色在 class.html 的 --course-<key>，不从表格读取。

