# _data/classes.yml
# Elle 的课程数据。class.html 构建时通过 {{ site.data.classes | jsonify }} 读取，
# 新增一次上课或一笔缴费，只在这个文件里追加一条，页面的 JS 不用动。
#
# 结构：
#   courses[]            每门课一条。key 只用于锚点，label 是展示名。
#   courses[].payments[] 缴费记录。date / amount / credits 必填，note 可选。
#   courses[].sessions[] 上课记录。date 必填；别的都可以不写。
#      - credits: 本次消耗的课时数，默认 1。连上两节或请假扣课时时才需要写。
#      - mode:    线上 / 线下，默认 线下（页面里显示成「线上课」「线下课」）。
#      - note:    临时调课、状态说明之类，没有就留空。
#
# 剩余课时 = 累计购课 - 已上课时（含 credits），页面自动算，不要在数据里写死。
# 日期一律用 "YYYY-MM-DD"，加引号，否则会被 YAML 解析成日期对象。
#
# 新增一门课时：在这里追加一条，并在 class.html 的 :root 里补一组同名的
# --course-<key> / --course-<key>-soft 颜色变量（浅色和深色两处）。

