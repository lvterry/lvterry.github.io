# _data/scores.yml
# 考试成绩数据。score.html 构建时通过 {{ site.data.scores | jsonify }} 读取，
# 新增一次考试只需在 exams 下面追加一条，不需要改页面的 JS。
#
# 只写当次实际公布的科目，缺失的科目留空不写，不要填 0：
# 0 表示"考了得 0 分"，留空表示"当次未公布"。
#
# exams[].scores 的键取自下面 subjects 里的 key。新增科目时，
# 除在这里加一条，还要在 score.html 的 :root 里补一个对应的 CSS 变量。
#
# grade 是年级排名档位：把全部成绩等分成 10 档，G8 即第 8 档 = 年级前 20%–30%。

subjects:
  - key: chinese
    label: 语文
    color: var(--subject-chinese)
  - key: math
    label: 数学
    color: var(--subject-math)
  - key: english
    label: 英语
    color: var(--subject-english)
  - key: history
    label: 历史
    color: var(--subject-history)
  - key: biology
    label: 生物
    color: var(--subject-biology)
  - key: geography
    label: 地理
    color: var(--subject-geography)
  - key: morals
    label: 道法
    color: var(--subject-morals)

# 语数英：每次考试都公布，作为全期可比的基线，也是默认视图。
core:
  - chinese
  - math
  - english

