---
# 成绩数据在 _data/scores.yml，构建时由 Jekyll 注入本页；新增考试只改那个文件。
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>成绩 | Terry Wang</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="考试成绩曲线：七门总分、语数英、单科。" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <style>
      :root {
        --bg: #fdfdfc;
        --fg: #1c1c1c;
        --muted: #777;
        --accent: #c23a2b;
        --border: #e6e3df;
        --code: #f3f1ee;
        --up: #2f6b4f;
        --down: #c23a2b;
        --chart-line: #1c1c1c;
        --subject-chinese: #c23a2b;
        --subject-math: #2a5a8c;
        --subject-english: #2f6b4f;
        --subject-history: #8a5a32;
        --subject-biology: #4d7340;
        --subject-geography: #3d6a78;
        --subject-morals: #6a5348;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --fg: #e9e6e1;
          --muted: #8a8780;
          --accent: #e07a6a;
          --border: #2a2a2a;
          --code: #1f1f1f;
          --up: #8fbfa3;
          --down: #e07a6a;
          --chart-line: #e9e6e1;
          --subject-chinese: #e07a6a;
          --subject-math: #7aa3d4;
          --subject-english: #8fbfa3;
          --subject-history: #c4a07a;
          --subject-biology: #9bbb7a;
          --subject-geography: #7aa8b5;
          --subject-morals: #c4b0a4;
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: #ffe9b3; }
      @media (prefers-color-scheme: dark) {
        ::selection { background: #4a3a00; }
      }
      a {
        color: var(--fg);
        text-decoration: underline 0.08em;
        text-decoration-color: var(--border);
        text-underline-offset: 0.18em;
      }
      a:hover { color: var(--muted); }
      button { font-family: inherit; }
      button:not(:disabled) { cursor: pointer; }
      .wrap { max-width: 920px; margin: 0 auto; padding: 0 1.25rem; }
      header { padding: 2.5rem 0 1.5rem; }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        color: var(--fg);
      }
      .avatar {
        width: 40px; height: 40px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--code); font-size: 0.7rem; font-weight: 600;
        flex-shrink: 0;
      }
      .brand img.avatar { display: block; object-fit: cover; }
      .name { font-weight: 600; font-size: 1.05rem; }
      .brand-note { color: var(--muted); font-size: 0.85rem; }
      .main-nav {
        margin-top: 0.9rem;
        display: flex; flex-wrap: wrap; gap: 1rem;
        font-size: 0.95rem;
      }
      .main-nav .current { font-weight: 500; text-decoration: none; }
      .banner { margin: 1rem 0 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
      .kicker { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; }
      h1 { font-size: 1.7rem; line-height: 1.25; margin: 0; font-weight: 600; text-wrap: balance; }
      .lead { color: var(--muted); margin: 0.5rem 0 0; max-width: 46ch; }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        margin: 2rem 0;
      }
      @media (min-width: 640px) {
        .stats { grid-template-columns: repeat(4, 1fr); }
      }
      .stat {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem 1rem;
      }
      .stat-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
      .stat-value { margin-top: 0.15rem; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .stat-hint { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .stat-hint.up { color: var(--up); }
      .stat-hint.down { color: var(--down); }
      .toggles, .subjects { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
      .chip {
        min-height: 44px;
        padding: 0 1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 0.9rem;
        font-weight: 500;
      }
      .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
      .sub-chip {
        min-height: 44px;
        padding: 0 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 0.88rem;
        display: inline-flex; align-items: center; gap: 0.45rem;
      }
      .sub-chip[aria-pressed="false"] { opacity: 0.4; }
      .dot { width: 8px; height: 8px; border-radius: 99px; }
      .chart-panel { border: 1px solid var(--border); border-radius: 12px; padding: 0.5rem 0.5rem 0.25rem; }
      @media (min-width: 640px) { .chart-panel { padding: 1rem; } }
      .chart-canvas { position: relative; width: 100%; min-height: 280px; }
      #grade-chart { min-height: 240px; }
      .bar { cursor: pointer; }
      .chart-empty { margin: 0; padding: 4rem 1rem; text-align: center; color: var(--muted); }
      .chart-tooltip {
        position: absolute; z-index: 2;
        min-width: 160px; max-width: 240px;
        padding: 0.7rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg); color: var(--fg);
        font-size: 0.8rem; line-height: 1.45;
        pointer-events: none;
        box-shadow: 0 8px 24px color-mix(in oklab, var(--fg) 10%, transparent);
        opacity: 0;
      }
      .tip-kicker { color: var(--muted); font-size: 0.72rem; }
      .tip-grade { margin: 0.15rem 0 0.45rem; font-weight: 600; }
      .tip-row { display: flex; align-items: center; gap: 0.4rem; font-variant-numeric: tabular-nums; }
      .tip-row strong { margin-left: auto; }
      .tip-row .swatch { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }
      .hint { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.8rem; }
      h2 { font-size: 1.15rem; margin: 2.5rem 0 0.75rem; }
      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 3rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
        font-variant-numeric: tabular-nums;
      }
      th, td {
        padding: 0.55rem 0.7rem;
        text-align: right;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th:first-child, td:first-child,
      th:nth-child(2), td:nth-child(2) { text-align: left; }
      thead th {
        font-weight: 500; color: var(--muted); font-size: 0.75rem;
        background: color-mix(in oklab, var(--fg) 3%, var(--bg));
      }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover td { background: color-mix(in oklab, var(--fg) 3.5%, transparent); }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .na { color: var(--muted); }
      .copyright { color: var(--muted); font-size: 0.85rem; margin: 3rem 0 2.5rem; }
      @media (max-width: 520px) {
        body { font-size: 16px; }
        h1 { font-size: 1.45rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .chart-tooltip { transition: none; }
      }

      /* 私人页面之间的切换导航：只有成绩和课程两项 */
      .page-nav {
        display: flex; gap: 1.25rem;
        padding: 2rem 0 0;
        font-size: 0.95rem;
      }
      .page-nav a { color: var(--muted); text-decoration: none; }
      .page-nav a:hover { color: var(--fg); }
      .page-nav a.current { color: var(--fg); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="wrap">

      <nav class="page-nav" aria-label="页面导航">
        <a href="/score.html" class="current" aria-current="page">成绩</a>
        <a href="/class.html">课程</a>
      </nav>

      <main>

        <section class="stats" id="stats"></section>

        <div class="toggles" id="modes"></div>
        <div class="subjects" id="subjects" hidden></div>
        <div class="chart-panel">
          <div class="chart-canvas" id="chart"></div>
        </div>
        <p class="hint" id="chart-hint">横轴为考试时间，纵轴为分数。悬停或点按查看明细。</p>

        <h2>年级排名</h2>
        <div class="chart-panel">
          <div class="chart-canvas" id="grade-chart"></div>
        </div>
        <p class="hint">横轴为考试时间，纵轴为排名档位（G6 = 6、G7 = 7、G8 = 8），柱越高名次越靠前。悬停或点按查看明细。</p>

        <h2>历次考试</h2>
        <p class="hint">月考通常只公布语数英；未公布的成绩与无法同口径比较的「较上次」均显示「—」。</p>
        <div class="table-wrap" id="table"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script>
      /* ===== 成绩数据 =====
         数据在 _data/scores.yml，构建时由 Jekyll 注入到下面这行；
         新增考试只改那个文件，本页的 JS 不用动。 */
      const DATA = {{ site.data.scores | jsonify }};
      const SUBJECTS = DATA.subjects;
      const CORE3 = DATA.core;
      const EXAMS = DATA.exams;

      const KEYS = SUBJECTS.map((s) => s.key);
      function scoreOf(exam, key) {
        const v = exam.scores[key];
        return typeof v === "number" && isFinite(v) ? v : null;
      }
      /* 只有 keys 全部有成绩才返回总分：口径不齐时不把缺失当 0 硬加。 */
      function sumOf(exam, keys) {
        let total = 0;
        for (const k of keys || KEYS) {
          const v = scoreOf(exam, k);
          if (v === null) return null;
          total += v;
        }
        return total;
      }
      function formatScore(v) {
        return v === null || v === undefined ? "—" : String(v);
      }
      /* G band：把全部成绩等分成 10 档，G8 即第 8 档 = 年级前 20%–30%。 */
      function bandLabel(g) {
        if (g === null || g === undefined) return "";
        const m = /^G(\d{1,2})$/.exec(String(g));
        if (!m) return g;
        const n = Number(m[1]);
        if (n < 1 || n > 10) return g;
        const lower = (10 - n) * 10;
        return lower === 0 ? "年级前 " + (lower + 10) + "%" : "年级前 " + lower + "–" + (lower + 10) + "%";
      }
      function gradeLabel(g) {
        if (g === null || g === undefined) return "";
        const band = bandLabel(g);
        return band === g ? g : g + " · " + band;
      }
      function formatDate(iso) {
        const p = iso.split("-");
        return p[0] + "." + Number(p[1]) + "." + Number(p[2]);
      }
      function formatDelta(v) {
        if (v === null || v === undefined) return "—";
        return v > 0 ? "+" + v : String(v);
      }
      function cssVar(name, fallback) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
      }

      /* 只和上一次同口径的考试比较，避免拿三门总分去减七门总分。 */
      function previousIndexWithTotal(from, keys) {
        for (let i = from - 1; i >= 0; i -= 1) {
          if (sumOf(EXAMS[i], keys) !== null) return i;
        }
        return -1;
      }

      const lastIndex = EXAMS.length - 1;
      const latest = EXAMS[lastIndex];
      const latest7 = sumOf(latest, KEYS);
      const latest3 = sumOf(latest, CORE3);
      const prev7Index = previousIndexWithTotal(lastIndex, KEYS);
      const prev3Index = previousIndexWithTotal(lastIndex, CORE3);
      const d7 = latest7 !== null && prev7Index >= 0 ? latest7 - sumOf(EXAMS[prev7Index], KEYS) : null;
      const core3Delta = latest3 !== null && prev3Index >= 0 ? latest3 - sumOf(EXAMS[prev3Index], CORE3) : null;

      document.getElementById("stats").innerHTML = [
        stat("最近一次", latest.name, formatDate(latest.date)),
        latest7 !== null
          ? stat("七门总分", latest7, formatDelta(d7), d7 > 0 ? "up" : d7 < 0 ? "down" : "")
          : stat("七门总分", "—", "当次仅公布语数英"),
        stat("语数英", formatScore(latest3), formatDelta(core3Delta), core3Delta > 0 ? "up" : core3Delta < 0 ? "down" : ""),
        stat("年级排名", latest.grade ? formatScore(latest.grade) : "—", latest.grade ? gradeLabel(latest.grade) : "当次未公布"),
      ].join("");

      function stat(label, value, hint, tone) {
        return '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div><div class="stat-hint ' + (tone || "") + '">' + hint + "</div></div>";
      }

      let mode = "core3";
      let active = KEYS.slice();

      const modesEl = document.getElementById("modes");
      const subjectsEl = document.getElementById("subjects");
      [
        { id: "core3", label: "语数英" },
        { id: "total7", label: "七门总分" },
        { id: "subject", label: "单科" },
      ].forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = item.label;
        btn.dataset.mode = item.id;
        btn.setAttribute("aria-pressed", item.id === mode ? "true" : "false");
        btn.addEventListener("click", () => {
          mode = item.id;
          modesEl.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"));
          subjectsEl.hidden = mode !== "subject";
          draw();
        });
        modesEl.append(btn);
      });

      SUBJECTS.forEach((s) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sub-chip";
        btn.setAttribute("aria-pressed", "true");
        btn.innerHTML = '<span class="dot" style="background:' + s.color + '"></span>' + s.label;
        btn.addEventListener("click", () => {
          if (active.includes(s.key)) {
            if (active.length === 1) return;
            active = active.filter((k) => k !== s.key);
          } else {
            active = active.concat(s.key);
          }
          btn.setAttribute("aria-pressed", active.includes(s.key) ? "true" : "false");
          draw();
        });
        subjectsEl.append(btn);
      });

      const tableRows = EXAMS.slice().reverse().map((exam, i, arr) => {
        const t7 = sumOf(exam, KEYS);
        const t3 = sumOf(exam, CORE3);
        /* 往回找最近一次同样有七门总分的考试，跨口径不做差。 */
        let dd = null;
        if (t7 !== null) {
          for (let j = i + 1; j < arr.length; j += 1) {
            const older = sumOf(arr[j], KEYS);
            if (older !== null) {
              dd = t7 - older;
              break;
            }
          }
        }
        return { exam, t7, t3, dd };
      });
      document.getElementById("table").innerHTML =
        "<table><thead><tr><th>日期</th><th>考试</th>" +
        SUBJECTS.map((s) => "<th>" + s.label + "</th>").join("") +
        "<th>语数英</th><th>七门</th><th>七门较上次</th><th>排名</th></tr></thead><tbody>" +
        tableRows
          .map(({ exam, t7, t3, dd }) => {
            const cls = dd > 0 ? "up" : dd < 0 ? "down" : "";
            return (
              "<tr><td>" + formatDate(exam.date) + "</td><td>" + exam.name + "</td>" +
              KEYS.map((k) => {
                const v = scoreOf(exam, k);
                return "<td class='" + (v === null ? "na" : "") + "'>" + formatScore(v) + "</td>";
              }).join("") +
              "<td>" + formatScore(t3) + "</td><td>" + formatScore(t7) + "</td><td class='" + cls + "'>" + formatDelta(dd) + "</td><td class='" + (exam.grade ? "" : "na") + "' title='" + (exam.grade ? gradeLabel(exam.grade) : "") + "'>" + (exam.grade ? exam.grade : "—") + "</td></tr>"
            );
          })
          .join("") +
        "</tbody></table>";

      function buildSeries() {
        const dates = EXAMS.map((e) => new Date(e.date + "T12:00:00"));
        if (mode === "total7") {
          /* 缺失处为 null：折线在此断开，不做跨口径连线。 */
          return [{ id: "total7", label: "七门总分", color: cssVar("--chart-line", "#1c1c1c"), values: EXAMS.map((e, i) => ({ date: dates[i], value: sumOf(e, KEYS) })) }];
        }
        if (mode === "core3") {
          return [{ id: "core3", label: "语数英总分", color: cssVar("--accent", "#c23a2b"), values: EXAMS.map((e, i) => ({ date: dates[i], value: sumOf(e, CORE3) })) }];
        }
        return SUBJECTS.filter((s) => active.includes(s.key)).map((s) => ({
          id: s.key,
          label: s.label,
          color: cssVar(s.color.replace("var(", "").replace(")", ""), cssVar("--fg", "#1c1c1c")),
          values: EXAMS.map((e, i) => ({ date: dates[i], value: scoreOf(e, s.key) })),
        }));
      }

      function resolveColor(seriesItem) {
        if (seriesItem.id === "total7") return cssVar("--chart-line", "#1c1c1c");
        if (seriesItem.id === "core3") return cssVar("--accent", "#c23a2b");
        const sub = SUBJECTS.find((s) => s.key === seriesItem.id);
        return sub ? cssVar(sub.color.slice(4, -1), cssVar("--fg", "#1c1c1c")) : cssVar("--fg", "#1c1c1c");
      }

      const wrap = document.getElementById("chart");
      const chartHint = document.getElementById("chart-hint");
      function draw() {
        const series = buildSeries().map((s) => ({ ...s, color: resolveColor(s) }));
        wrap.innerHTML = "";
        if (!series.length) {
          wrap.innerHTML = '<p class="chart-empty">选择至少一门科目。</p>';
          if (chartHint) chartHint.textContent = "";
          return;
        }
        const width = Math.max(wrap.clientWidth, 280);
        const height = width < 520 ? 280 : 360;
        const margin = { top: 20, right: 16, bottom: 36, left: 44 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const all = series.flatMap((s) => s.values.map((v) => v.value)).filter((v) => v !== null);
        if (!all.length) {
          wrap.innerHTML = '<p class="chart-empty">所选科目暂无成绩。</p>';
          if (chartHint) chartHint.textContent = "";
          return;
        }
        const rawMin = d3.min(all);
        const rawMax = d3.max(all);
        const pad = Math.max((rawMax - rawMin) * 0.18, mode === "subject" ? 4 : 8);
        const yMax = Math.ceil(rawMax + pad);
        const x = d3.scaleTime().domain(d3.extent(series[0].values, (d) => d.date)).range([0, innerW]);
        const y = d3.scaleLinear().domain([0, yMax]).nice().range([innerH, 0]);
        const line = d3.line().defined((d) => d.value !== null).x((d) => x(d.date)).y((d) => y(d.value)).curve(d3.curveMonotoneX);
        const bridge = d3.line().x((d) => x(d.date)).y((d) => y(d.value)).curve(d3.curveMonotoneX);
        const area = d3.area().defined((d) => d.value !== null).x((d) => x(d.date)).y0(innerH).y1((d) => y(d.value)).curve(d3.curveMonotoneX);
        const svg = d3.select(wrap).append("svg").attr("viewBox", "0 0 " + width + " " + height).attr("role", "img").attr("aria-label", "成绩曲线").style("width", "100%").style("height", "auto");
        const g = svg.append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");
        const axisColor = cssVar("--muted", "#777");
        const gridColor = cssVar("--border", "#e6e3df");
        const fg = cssVar("--fg", "#1c1c1c");
        const dates = series[0].values.map((v) => v.date);
        g.append("g").call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(() => "")).call((sel) => { sel.select(".domain").remove(); sel.selectAll("line").attr("stroke", gridColor).attr("stroke-dasharray", "3 4"); });
        g.append("g").attr("transform", "translate(0," + innerH + ")").call(d3.axisBottom(x).tickValues(width < 520 ? dates.filter(function(_, i) { return i % 2 === 0 || i === dates.length - 1; }) : dates).tickFormat((d) => d.getMonth() + 1 + "月")).call((sel) => { sel.select(".domain").attr("stroke", gridColor); sel.selectAll("line").attr("stroke", gridColor); sel.selectAll("text").attr("fill", axisColor).attr("font-size", 11).attr("font-family", "inherit"); });
        g.append("g").call(d3.axisLeft(y).ticks(5).tickSize(0)).call((sel) => { sel.select(".domain").remove(); sel.selectAll("text").attr("fill", axisColor).attr("font-size", 11).attr("font-family", "inherit").attr("dx", "-0.2em"); });
        const single = series.length === 1;
        const hasGap = series.some((s) => s.values.some((v) => v.value === null));
        series.forEach((s) => {
          const known = s.values.filter((v) => v.value !== null);
          const gap = known.length !== s.values.length;
          if (single) g.append("path").datum(s.values).attr("fill", s.color).attr("fill-opacity", 0.08).attr("d", area);
          /* 跨缺失点的趋势用浅虚线表示，实线段仍只在连续有分的区间绘制。 */
          if (gap && known.length > 1) {
            g.append("path").datum(known).attr("class", "gap-bridge").attr("fill", "none").attr("stroke", s.color).attr("stroke-width", single ? 1.6 : 1.3).attr("stroke-opacity", 0.45).attr("stroke-dasharray", "3 4").attr("d", bridge);
          }
          g.append("path").datum(s.values).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", single ? 2.2 : 1.8).attr("stroke-linejoin", "round").attr("stroke-linecap", "round").attr("d", line);
          g.selectAll("circle." + s.id).data(known).join("circle").attr("cx", (d) => x(d.date)).attr("cy", (d) => y(d.value)).attr("r", single ? 4 : 3).attr("fill", cssVar("--bg", "#fdfdfc")).attr("stroke", s.color).attr("stroke-width", 1.8);
        });
        const tooltip = d3.select(wrap).append("div").attr("class", "chart-tooltip");
        const hover = g.append("g").style("pointer-events", "none");
        hover.append("line").attr("class", "hover-line").attr("y1", 0).attr("y2", innerH).attr("stroke", fg).attr("stroke-opacity", 0.28).attr("stroke-dasharray", "2 3").style("opacity", 0);
        const bisect = d3.bisector((d) => d).center;
        function showAt(mx) {
          const date = x.invert(mx);
          const i = Math.max(0, Math.min(dates.length - 1, bisect(dates, date)));
          const exam = EXAMS[i];
          const cx = x(dates[i]);
          hover.select(".hover-line").attr("x1", cx).attr("x2", cx).style("opacity", 1);
          tooltip.html(
            '<div class="tip-kicker">' + formatDate(exam.date) + " · " + exam.name + "</div>" +
            '<div class="tip-grade">' + (exam.grade ? gradeLabel(exam.grade) : "—") + "</div>" +
            series.map((s) => '<div class="tip-row"><span class="swatch" style="background:' + s.color + '"></span><span>' + s.label + "</span><strong>" + formatScore(s.values[i].value) + "</strong></div>").join("")
          ).style("opacity", 1);
          const tw = tooltip.node().offsetWidth;
          const left = Math.min(Math.max(cx + margin.left - tw / 2, 8), width - tw - 8);
          tooltip.style("left", left + "px").style("top", "8px");
        }
        function hide() {
          hover.select(".hover-line").style("opacity", 0);
          tooltip.style("opacity", 0);
        }
        svg.append("rect").attr("x", margin.left).attr("y", margin.top).attr("width", innerW).attr("height", innerH).attr("fill", "transparent").style("cursor", "crosshair")
          .on("mousemove", (event) => showAt(d3.pointer(event, g.node())[0]))
          .on("mouseleave", hide)
          .on("touchstart", (event) => { event.preventDefault(); showAt(d3.pointer(event, g.node())[0]); })
          .on("touchmove", (event) => showAt(d3.pointer(event, g.node())[0]));
        if (chartHint) {
          chartHint.textContent = hasGap
            ? "横轴为考试时间，纵轴为分数。悬停或点按查看明细；虚线为跨口径趋势，表示该次未公布对应科目。"
            : "横轴为考试时间，纵轴为分数。悬停或点按查看明细。";
        }
      }

      /* ===== 年级排名柱状图：G6 = 6、G7 = 7、G8 = 8，柱越高名次越靠前 ===== */
      const gradeWrap = document.getElementById("grade-chart");
      function gradeValue(g) {
        const m = /^G(\d{1,2})$/.exec(String(g === null || g === undefined ? "" : g));
        return m ? Number(m[1]) : null;
      }

      function drawGrades() {
        if (!gradeWrap) return;
        gradeWrap.innerHTML = "";
        const points = EXAMS.map((exam) => ({ exam, value: gradeValue(exam.grade) }));
        const known = points.filter((p) => p.value !== null);
        if (!known.length) {
          gradeWrap.innerHTML = '<p class="chart-empty">暂无排名数据。</p>';
          return;
        }
        const width = Math.max(gradeWrap.clientWidth, 280);
        const height = width < 520 ? 240 : 280;
        const margin = { top: 24, right: 16, bottom: 36, left: 44 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const barColor = cssVar("--accent", "#c23a2b");
        const axisColor = cssVar("--muted", "#777");
        const gridColor = cssVar("--border", "#e6e3df");
        /* 每次考试一根柱，纵轴 0 起、上界为最高档位，数值即 G 后面的数字。 */
        const x = d3.scaleBand().domain(points.map((p) => p.exam.date)).range([0, innerW]).padding(points.length > 6 ? 0.32 : 0.42);
        const y = d3.scaleLinear().domain([0, d3.max(known, (p) => p.value)]).range([innerH, 0]);
        const labelEvery = width < 520 ? 2 : 1;
        const labelDates = points.filter((p, i) => i % labelEvery === 0 || i === points.length - 1).map((p) => p.exam.date);
        const svg = d3.select(gradeWrap).append("svg").attr("viewBox", "0 0 " + width + " " + height).attr("role", "img").attr("aria-label", "年级排名档位柱状图").style("width", "100%").style("height", "auto");
        const g = svg.append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");
        g.append("g").call(d3.axisLeft(y).ticks(4).tickSize(-innerW).tickFormat(() => "")).call((sel) => { sel.select(".domain").remove(); sel.selectAll("line").attr("stroke", gridColor).attr("stroke-dasharray", "3 4"); });
        g.append("g").attr("transform", "translate(0," + innerH + ")").call(d3.axisBottom(x).tickValues(labelDates).tickSize(0).tickFormat((d) => Number(d.slice(5, 7)) + "月")).call((sel) => { sel.select(".domain").attr("stroke", gridColor); sel.selectAll("text").attr("fill", axisColor).attr("font-size", 11).attr("font-family", "inherit"); });
        g.append("g").call(d3.axisLeft(y).ticks(4).tickSize(0)).call((sel) => { sel.select(".domain").remove(); sel.selectAll("text").attr("fill", axisColor).attr("font-size", 11).attr("font-family", "inherit").attr("dx", "-0.2em"); });
        const bars = g.selectAll("rect.bar").data(known).join("rect").attr("class", "bar")
          .attr("x", (p) => x(p.exam.date)).attr("y", (p) => y(p.value)).attr("width", x.bandwidth()).attr("height", (p) => innerH - y(p.value))
          .attr("rx", 2).attr("fill", barColor).attr("fill-opacity", 0.85);
        /* 柱顶标出档位代号，和纵轴上的数字一一对应。 */
        g.selectAll("text.bar-label").data(known).join("text").attr("class", "bar-label")
          .attr("x", (p) => x(p.exam.date) + x.bandwidth() / 2).attr("y", (p) => y(p.value) - 6)
          .attr("text-anchor", "middle").attr("fill", axisColor).attr("font-size", 11).attr("font-family", "inherit")
          .text((p) => p.exam.grade);
        const tooltip = d3.select(gradeWrap).append("div").attr("class", "chart-tooltip");
        function show(p) {
          bars.attr("fill-opacity", (d) => (d === p ? 1 : 0.4));
          tooltip.html(
            '<div class="tip-kicker">' + formatDate(p.exam.date) + " · " + p.exam.name + "</div>" +
            '<div class="tip-grade">' + (p.exam.grade ? gradeLabel(p.exam.grade) : "—") + "</div>" +
            '<div class="tip-row"><span class="swatch" style="background:' + barColor + '"></span><span>排名档位</span><strong>' + (p.value !== null ? p.value : "—") + "</strong></div>"
          ).style("opacity", 1);
          const tw = tooltip.node().offsetWidth;
          const th = tooltip.node().offsetHeight;
          const cx = margin.left + x(p.exam.date) + x.bandwidth() / 2;
          tooltip.style("left", Math.min(Math.max(cx - tw / 2, 8), width - tw - 8) + "px")
            .style("top", Math.max(8, margin.top + y(p.value) - th - 10) + "px");
        }
        function hide() {
          bars.attr("fill-opacity", 0.85);
          tooltip.style("opacity", 0);
        }
        bars.on("mouseenter", (event, p) => show(p)).on("mouseleave", hide)
          .on("touchstart", (event, p) => { event.preventDefault(); show(p); })
          .on("touchmove", (event, p) => { event.preventDefault(); show(p); });
      }

      function drawAll() {
        draw();
        drawGrades();
      }

      drawAll();
      window.addEventListener("resize", drawAll);
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);
    </script>
  </body>
</html>
