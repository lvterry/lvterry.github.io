<style>
.videoWrapper {
	position: relative;
	padding-bottom: 56.333%;
	height: 0;
    background: black;
}
.videoWrapper iframe {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
    border: 0;
}    
</style>

<script>
function parse_url(url) {
    try {
        var parsed = new URL(url, document.baseURI);
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return null;
        if (parsed.username || parsed.password) return null;
        return parsed;
    } catch (error) {
        return null;
    }
}
function get_youtube_id(url) {
    var u = parse_url(url);
    if (!u) return null;
    var id = null;
    if (u.hostname === 'youtu.be') {
        id = u.pathname.slice(1);
    } else if (u.hostname === 'youtube.com' || u.hostname === 'www.youtube.com') {
        if (u.pathname === '/watch') id = u.searchParams.get('v');
        else if (/^\/(embed|v)\//.test(u.pathname)) id = u.pathname.split('/')[2];
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}
function insert_video(el, src) {
    var wrapper = document.createElement('div');
    wrapper.className = 'videoWrapper';
    var iframe = document.createElement('iframe');
    iframe.src = src.href;
    iframe.width = '720';
    iframe.height = '420';
    iframe.title = 'Video player';
    iframe.allowFullscreen = true;
    wrapper.appendChild(iframe);
    el.replaceChildren(wrapper);
}
function vimeo_embed(url, el) {
    var u = parse_url(url);
    if (!u || !['vimeo.com', 'www.vimeo.com', 'player.vimeo.com'].includes(u.hostname)) return;
    fetch('https://vimeo.com/api/oembed.json?url=' + encodeURIComponent(u.href))
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(response) {
        if (!response || !/^[0-9]+$/.test(String(response.video_id))) return;
        var src = new URL('https://player.vimeo.com/video/' + response.video_id + '/');
        src.search = 'byline=0&title=0&portrait=0';
        if (u.searchParams.get('autoplay') === '1') src.searchParams.set('autoplay', '1');
        if (u.searchParams.get('loop') === '1') src.searchParams.set('loop', '1');
        insert_video(el, src);
      })
      .catch(function() { /* Leave the original link in place. */ });
}
/* Only replace paragraphs containing a single link and no surrounding prose. */
function paragraph_link_only(el) {
    var kids = el.children;
    if (kids.length !== 1 || kids[0].tagName !== 'A') return '';
    if (el.textContent.trim() !== kids[0].textContent.trim()) return '';
    return kids[0].getAttribute('href') || '';
}
function video_embed() {
    Array.from(document.getElementsByTagName('p')).forEach(function(el) {
        var url = paragraph_link_only(el);
        if (!url) return;
        var u = parse_url(url);
        if (!u) return;
        var id = get_youtube_id(url);
        if (!id) {
            vimeo_embed(url, el);
            return;
        }
        var src = new URL('https://www.youtube.com/embed/' + id);
        src.search = 'rel=0&showinfo=0';
        if (u.searchParams.get('autoplay') === '1') src.searchParams.set('autoplay', '1');
        if (u.searchParams.get('loop') === '1') {
            src.searchParams.set('loop', '1');
            src.searchParams.set('playlist', id);
            src.searchParams.set('version', '3');
        }
        var start = u.searchParams.get('start');
        if (start && /^[0-9]+$/.test(start)) src.searchParams.set('start', start);
        insert_video(el, src);
    });
}
function mp3_embed() {
    Array.from(document.getElementsByTagName('p')).forEach(function(el) {
        var url = paragraph_link_only(el);
        if (!url) return;
        var u = parse_url(url);
        if (!u || !u.pathname.endsWith('.mp3')) return;
        var audio = document.createElement('audio');
        audio.autoplay = u.searchParams.get('autoplay') === '1';
        audio.loop = u.searchParams.get('loop') === '1';
        audio.controls = u.searchParams.get('controls') !== '0';
        var source = document.createElement('source');
        source.src = u.href;
        source.type = 'audio/mpeg';
        audio.appendChild(source);
        audio.appendChild(document.createTextNode('Your browser does not support the audio element.'));
        el.replaceChildren(audio);
    });
}
video_embed();
mp3_embed();
</script>
