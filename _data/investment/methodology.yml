# _data/investment/methodology.yml
# 页面底部的口径说明。改句子可以，不要把没拿到的数据写成 0 或估计值。

items:
  - id: public
    text: 公开页面只有投资框架、观察名单、目标权重和脱敏状态。实际仓位可以一直空着。
  - id: missing
    text: 没有的数据留空。不要用 0 表示「不知道」。估值、收益和组合贡献只在有来源时才出现。
  - id: asof
    text: 价格截至和持仓截至分开写。时区是 Asia/Shanghai，并写明是否包含盘后。
  - id: cash
    text: SGOV 和 TFLO 算现金，不算股票。
  - id: overlap
    text: 境内和境外的长期资金，可能和美股科技敞口是同一笔钱的两面。这里没有做完整穿透，目标权重不是全账户穿透后的真实暴露。
  - id: diversify
    text: 四只股票共享平台与宏观风险。放在一起不等于已经分散。
  - id: suggestions
    text: 行动建议不是下单。缺数据时显示「无法判断」，不默认「继续持有」，也不默认什么都不做。
  - id: sim
    text: 「若调整」只按实际百分比减去目标百分比来估算。不含交易成本和税，也不会发出订单。
  - id: threshold
    text: 观察阈值还没确认。它可以以后再配置，但不是一条锁定的强制交易规则。
  - id: history
    text: 时间线保留更正，不覆盖旧记录。焦点历史不回填没核实过的内容。行情和基本面没有来源就留空。
  - id: local
    text: 股数和金额只留在自己的电脑上。浏览器里的导入不会上传，刷新页面就清除，也不写入这个仓库。
