---
title: Collection · Terry Wang
layout: default
bodyClass: collection-page
---

{% include header.html %}

<main>
  <section class="page-banner">
    <h1 class="page-title">Collection</h1>
    <p class="page-lead">和 AI 一起探索艺术，收藏途中喜欢的作品。</p>
  </section>

  <ul class="collection-grid">
    {% for artwork in site.data.artworks %}
    <li>
      <a class="collection-image" href="{{ artwork.image | relative_url }}" aria-label="查看《{{ artwork.title | escape }}》原图">
        <img src="{{ artwork.image | relative_url }}" alt="{{ artwork.alt | escape }}" width="{{ artwork.width }}" height="{{ artwork.height }}" decoding="async"{% unless forloop.first %} loading="lazy"{% endunless %}>
      </a>
    </li>
    {% endfor %}
  </ul>
</main>

<dialog class="collection-lightbox" aria-label="查看原图">
  <button type="button" class="collection-lightbox-close" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <img alt="">
</dialog>

<style>
  .collection-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1rem;
  }
  .collection-grid li { margin: 0; }
  .collection-image {
    position: relative;
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--border-color);
    cursor: zoom-in;
    touch-action: manipulation;
    text-decoration: none;
  }
  .collection-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--bg-color);
    animation: collection-placeholder-pulse 1.1s ease-in-out infinite alternate;
  }
  .collection-image.is-loaded::before {
    animation: none;
    opacity: 0;
  }
  @keyframes collection-placeholder-pulse {
    from { opacity: 0; }
    to { opacity: .6; }
  }
  .collection-image img {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (hover: hover) and (pointer: fine) {
    .collection-image:hover img { opacity: .88; }
  }

  .collection-lightbox {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: none;
    background: #0a0a0a;
  }
  .collection-lightbox[open] {
    display: grid;
    place-items: center;
  }
  .collection-lightbox::backdrop {
    background: #0a0a0a;
  }
  .collection-lightbox img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    object-fit: contain;
    cursor: zoom-out;
  }
  .collection-lightbox-close {
    position: fixed;
    top: max(.75rem, env(safe-area-inset-top));
    right: max(.75rem, env(safe-area-inset-right));
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    color: #f5f5f5;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (hover: hover) and (pointer: fine) {
    .collection-lightbox-close:hover { background: rgba(255, 255, 255, .22); }
  }
  .collection-lightbox[open] {
    animation: collection-lb-in 160ms ease-out;
  }
  @keyframes collection-lb-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .collection-lightbox[open] { animation: none; }
    .collection-image img { transition: none; }
    .collection-image::before { animation: none; }
  }
</style>

<script>
  (function () {
    const dialog = document.querySelector(".collection-lightbox");
    const fullImg = dialog.querySelector("img");
    const closeBtn = dialog.querySelector(".collection-lightbox-close");
    const links = Array.prototype.slice.call(document.querySelectorAll(".collection-image"));
    let currentIndex = -1;

    function showAt(index) {
      currentIndex = (index + links.length) % links.length;
      const link = links[currentIndex];
      const thumb = link.querySelector("img");
      fullImg.src = link.href;
      fullImg.alt = thumb ? thumb.alt : "";
    }

    function openLightbox(link) {
      showAt(links.indexOf(link));
      dialog.showModal();
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      if (dialog.open) dialog.close();
    }

    dialog.addEventListener("close", function () {
      document.body.style.overflow = "";
      fullImg.removeAttribute("src");
    });

    closeBtn.addEventListener("click", closeLightbox);

    dialog.addEventListener("click", function (e) {
      if (e.target === dialog || e.target === fullImg) closeLightbox();
    });

    document.addEventListener("keydown", function (e) {
      if (!dialog.open) return;
      if (e.key === "ArrowRight") {
        showAt(currentIndex + 1);
      } else if (e.key === "ArrowLeft") {
        showAt(currentIndex - 1);
      }
    });

    let touchStartX = null;

    dialog.addEventListener("touchstart", function (e) {
      if (e.touches.length > 1 || e.target.closest(".collection-lightbox-close")) {
        touchStartX = null;
        return;
      }
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    dialog.addEventListener("touchmove", function (e) {
      if (e.touches.length > 1) touchStartX = null;
    }, { passive: true });

    dialog.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < 40) return;
      showAt(currentIndex + (dx < 0 ? 1 : -1));
    }, { passive: true });

    dialog.addEventListener("touchcancel", function () {
      touchStartX = null;
    });

    links.forEach(function (link) {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        openLightbox(link);
      });

      const thumb = link.querySelector("img");
      const markLoaded = function () { link.classList.add("is-loaded"); };
      if (thumb.complete) {
        markLoaded();
      } else {
        thumb.addEventListener("load", markLoaded);
      }
    });
  })();
</script>
